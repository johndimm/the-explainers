      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="url(#bg)"/>
  
  <!-- Heart symbol -->
  <path d="M96,140 C96,120 80,100 60,100 C40,100 24,120 24,140 C24,160 40,180 96,220 C152,180 168,160 168,140 C168,120 152,100 132,100 C112,100 96,120 96,140 Z" 
