  <line x1="60" y1="80" x2="60" y2="120" stroke="white" stroke-width="4" opacity="0.8"/>
  <line x1="132" y1="80" x2="132" y2="120" stroke="white" stroke-width="4" opacity="0.8"/>
  <line x1="50" y1="80" x2="70" y2="80" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="122" y1="80" x2="142" y2="80" stroke="white" stroke-width="3" opacity="0.8"/>
  
  <!-- Main text -->
