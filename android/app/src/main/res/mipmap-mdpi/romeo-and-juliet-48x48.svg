  <line x1="25.40625" y1="22.59375" 
        x2="22.59375" y2="25.40625" 
        stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
  
  <!-- Heart (scaled) -->
  <path d="M24,24.5859375 
