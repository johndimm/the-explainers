<?xml version="1.0" encoding="UTF-8"?>
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F7FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="88" 
          fill="url(#bgGradient)" 
          stroke="#8B5CF6" 
          stroke-width="3"/>
  
  <!-- Balcony elements (scaled) -->
  <rect x="88.5" y="92.25" 
        width="7.5" height="3.75" 
        fill="#8B5CF6" opacity="0.3"/>
  <rect x="99.75" y="92.25" 
        width="7.5" height="3.75" 
        fill="#8B5CF6" opacity="0.3"/>
  
  <!-- Crossed swords (scaled) -->
  <line x1="90.375" y1="90.375" 
        x2="101.625" y2="101.625" 
        stroke="#8B5CF6" stroke-width="3" opacity="0.4"/>
  <line x1="101.625" y1="90.375" 
        x2="90.375" y2="101.625" 
        stroke="#8B5CF6" stroke-width="3" opacity="0.4"/>
  
  <!-- Heart (scaled) -->
  <path d="M96,98.34375 
           C91.3125,93.65625, 
             93.65625,91.3125, 
             96,93.65625
           C98.34375,91.3125, 
             100.6875,93.65625, 
             96,98.34375 Z" 
        fill="#8B5CF6" opacity="0.2"/>
  
  <!-- Main text -->
  <text x="96" y="115.19999999999999" 
        text-anchor="middle" 
        font-family="serif" 
        font-size="76" 
        font-weight="bold" 
        fill="#8B5CF6"
        filter="url(#shadow)">
    R&amp;J
  </text>
  
  <!-- Shakespeare attribution (only for larger icons) -->
  <text x="96" y="184" 
        text-anchor="middle" 
        font-family="serif" 
        font-size="12" 
        fill="#8B5CF6"
        opacity="0.7">
    Shakespeare
  </text>
</svg>