<?xml version="1.0" encoding="UTF-8"?>
<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8F7FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="72" cy="72" r="64" 
          fill="url(#bgGradient)" 
          stroke="#8B5CF6" 
          stroke-width="2.25"/>
  
  <!-- Balcony elements (scaled) -->
  <rect x="66.375" y="69.1875" 
        width="5.625" height="2.8125" 
        fill="#8B5CF6" opacity="0.3"/>
  <rect x="74.8125" y="69.1875" 
        width="5.625" height="2.8125" 
        fill="#8B5CF6" opacity="0.3"/>
  
  <!-- Crossed swords (scaled) -->
  <line x1="67.78125" y1="67.78125" 
        x2="76.21875" y2="76.21875" 
        stroke="#8B5CF6" stroke-width="2.25" opacity="0.4"/>
  <line x1="76.21875" y1="67.78125" 
        x2="67.78125" y2="76.21875" 
        stroke="#8B5CF6" stroke-width="2.25" opacity="0.4"/>
  
  <!-- Heart (scaled) -->
  <path d="M72,73.7578125 
           C68.484375,70.2421875, 
             70.2421875,68.484375, 
             72,70.2421875
           C73.7578125,68.484375, 
             75.515625,70.2421875, 
             72,73.7578125 Z" 
        fill="#8B5CF6" opacity="0.2"/>
  
  <!-- Main text -->
  <text x="72" y="86.39999999999999" 
        text-anchor="middle" 
        font-family="serif" 
        font-size="57" 
        font-weight="bold" 
        fill="#8B5CF6"
        filter="url(#shadow)">
    R&amp;J
  </text>
  
  <!-- Shakespeare attribution (only for larger icons) -->
  <text x="72" y="136" 
        text-anchor="middle" 
        font-family="serif" 
        font-size="9" 
        fill="#8B5CF6"
        opacity="0.7">
    Shakespeare
  </text>
</svg>